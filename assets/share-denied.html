<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>超出分享范围 · 文件浏览</title>
<style>
:root { color-scheme:light; --paper:#f7f8fc; --surface:#fff; --ink:#202333; --muted:#73788b; --line:#dfe3ee; --accent:#5b5bd6; --soft:#eeeeff; }
* { box-sizing:border-box; }
body { margin:0; min-height:100svh; display:flex; flex-direction:column; color:var(--ink); background:var(--paper); font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",sans-serif; }
header,footer { width:min(100% - 48px,960px); margin-inline:auto; }
header { padding-block:32px; display:flex; align-items:center; gap:10px; font:650 13px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace; letter-spacing:.08em; }
header svg { width:24px; height:24px; color:var(--accent); }
main { flex:1; width:min(100% - 48px,880px); margin-inline:auto; display:grid; align-content:center; padding:36px 0 64px; }
.card { display:grid; grid-template-columns:280px 1fr; align-items:center; gap:48px; padding:56px 48px; border:1px solid var(--line); border-radius:24px; background:var(--surface); }
.art { width:100%; height:auto; color:var(--accent); }
.caption { margin:0 0 14px; color:var(--muted); font:500 12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace; letter-spacing:.08em; }
h1 { margin:0; font-size:clamp(26px,3.6vw,34px); font-weight:650; letter-spacing:-.04em; line-height:1.35; }
.description { margin:18px 0 26px; max-width:28em; color:var(--muted); font-size:15px; line-height:1.85; }
a { display:inline-flex; align-items:center; justify-content:center; gap:12px; min-height:46px; padding:12px 18px; border-radius:10px; background:var(--accent); color:#fff; text-decoration:none; font-size:14px; font-weight:600; transition:background .15s ease; }
a:hover { background:#4949b8; }
a:focus-visible { outline:3px solid var(--accent); outline-offset:4px; }
a svg { width:18px; height:18px; }
.hint { margin:22px 0 0; color:var(--muted); font-size:12px; line-height:1.8; }
footer { padding-block:24px; color:var(--muted); font-size:12px; border-top:1px solid var(--line); }
:root[data-theme="dark"] { --paper:#14151e; --surface:#1c1e2b; --ink:#eeeefa; --muted:#a0a4ba; --line:#33364b; --accent:#8888ee; --soft:#2c2d49; } :where(:root[data-theme="dark"]) a { color:#14151e; } :where(:root[data-theme="dark"]) a:hover { background:#aaaaff; }
@media (max-width:700px) { header { padding-block:24px; } main { padding:16px 0 36px; } .card { grid-template-columns:1fr; gap:18px; padding:28px 24px 32px; } .art { width:190px; justify-self:center; } .description { font-size:14px; } }
@media (prefers-reduced-motion:reduce) { a { transition:none; } }
</style>
</head>
<body>
<header><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>WEBDIR / 文件分享</header>
<main>
<section class="card" aria-labelledby="title">
<svg class="art" viewBox="0 0 280 240" fill="none" aria-hidden="true">
<rect x="20" y="24" width="190" height="192" rx="24" fill="var(--soft)"/>
<path d="M210 40v160" stroke="currentColor" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="5 7"/>
<path d="M58 90a10 10 0 0 1 10-10h44l15 17h88a10 10 0 0 1 10 10v65a12 12 0 0 1-12 12H70a12 12 0 0 1-12-12Z" fill="var(--surface)" stroke="currentColor" stroke-width="2"/>
<path d="M59 113h165M80 139h48M80 153h31" stroke="currentColor" stroke-opacity=".4" stroke-width="2" stroke-linecap="round"/>
<circle cx="225" cy="170" r="26" fill="var(--accent)"/>
<path d="m229 161-9 9 9 9m-9-9h18" stroke="var(--surface)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<div>
<p class="caption">403 / 分享访问</p>
<h1 id="title">超出分享范围</h1>
<p class="description">这个位置不在当前链接的分享范围内。<br>你可以返回分享目录，继续浏览其中的文件。</p>
<a href="{{share_url}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 6-6 6 6 6M4 12h16"/></svg>返回分享目录</a>
<p class="hint">需要访问这个位置？请联系分享者获取对应链接。</p>
</div>
</section>
</main>
<footer>分享链接仅开放指定目录及其中的文件。</footer>
</body>
</html>
